name: Aegis Governance & Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Sentinel Audit & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite (pytest)
        run: |
          pytest -v tests/

      - name: Run Sentinel Instant Audit Gate
        run: |
          aah check --strict

      - name: Verify Audit Log Hash Chain Integrity
        run: |
          if [ -s .aegis/logs/audit-trail.jsonl ]; then
            aah verify --log-file .aegis/logs/audit-trail.jsonl
          fi
          if [ -s .aegis/logs/forensic-trail.jsonl ]; then
            aah verify --log-file .aegis/logs/forensic-trail.jsonl
          fi

      - name: Generate Governance Audit Report
        run: |
          aah report -o .aegis/reports/ci-summary.md
