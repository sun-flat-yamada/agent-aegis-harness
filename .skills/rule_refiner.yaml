name: rule_refiner
description: "Analyze historical audit blocks to find recurring friction or context drift, then propose policy updates via PR."
tools_required:
  - "view_file"
  - "run_command"
instructions: |
  1. Scan .aegis/logs/audit-trail.jsonl using cluster analyzer.
  2. Identify top 3 recurring false-positives or drift triggers.
  3. Generate patch for .aegis/rules/ and stage on a separate branch.
