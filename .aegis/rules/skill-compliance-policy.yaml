rule_id: "RULE-SKILL-001"
name: "Skill Execution Compliance"
description: "Verify that loaded skills match project allowed scopes and tool permissions."
severity: "MEDIUM"

enforce_allowed_tools: true
allowed_tools_whitelist:
  - "run_command"
  - "view_file"
  - "write_to_file"
  - "replace_file_content"
  - "multi_replace_file_content"
  - "list_dir"
  - "grep_search"
  - "search_web"
  - "read_url_content"
  - "ask_question"
