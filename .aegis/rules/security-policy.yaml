rule_id: "RULE-SEC-001"
name: "Security & Secret Leakage Prevention"
description: "Block dangerous system commands and redact secret credentials/PII."
severity: "CRITICAL"

dangerous_command_patterns:
  - '(?i)\brm\s+-[rf]{1,2}\s+/'
  - '(?i)\bformat\s+[c-z]:'
  - '(?i)\bdel\s+/[sfq]\s+c:\\'
  - '(?i)\bdrop\s+database\b'
  - '(?i)\bdrop\s+table\b'

redaction_patterns:
  - name: "OpenAI API Key"
    pattern: 'sk-[A-Za-z0-9]{20,48}'
    replacement: "[REDACTED_API_KEY]"
  - name: "Generic Secret Key"
    pattern: '(?i)(?:api_key|secret|token|password|bearer)\s*[:=]\s*["'']?([A-Za-z0-9_\-\.]{16,})["'']?'
    replacement: "[REDACTED_SECRET]"
  - name: "IPv4 Address"
    pattern: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
    replacement: "[REDACTED_IP]"
