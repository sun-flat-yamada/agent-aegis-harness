[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-aegis-harness"
version = "0.1.0"
description = "Automated Evaluation & Governance Infrastructure for Software-AI. An end-to-end technical harness to instrument, audit, and continuously evolve AI agent operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Youhei Yamada", email = "sun-flat-yamada@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.scripts]
aah = "aegis.cli:app"
aegis = "aegis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
